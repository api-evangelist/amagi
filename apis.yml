name: Amagi
description: 'Amagi is a cloud-based technology company for the broadcast and streaming television
  industry. Its SaaS platform handles channel creation and playout, content distribution across
  linear, FAST (free ad-supported streaming TV) and connected-TV (CTV) destinations, server-side
  dynamic ad insertion and monetization, and viewership/ads analytics — letting content owners run
  live, linear and VOD channels from the cloud. Founded in 2008 and backed by Accel and Norwest
  Venture Partners, Amagi exposes internal operational REST APIs (Mapsor job/user orchestration and
  the services-amagi-tv key/customer service) documented via ReDoc, plus open-source tooling such as
  SLV. This profile was enriched by the API Evangelist pipeline from Amagi''s published OpenAPI and
  public developer surface.'
