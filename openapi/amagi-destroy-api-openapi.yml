openapi: 3.2.0
info:
  description: 'The purpose of this application is to provide documentation of the APIs in mapsor


    # Authentication


    -->'
  title: Mapsor Destroy API
  contact:
    email: arpitm@amagi.com
  version: 0.2.0
servers:
- url: https://pbohw6r8e1.execute-api.us-east-1.amazonaws.com/dev/?token=Vqv80iwJyHVPreFu47dNYg
  description: Development Server
- url: https://api.mapsor.amagi.tv
  description: Production Server
tags:
- name: Destroy
paths:
  /destroy/{region}/{instance_id}:
    get:
      security:
      - TokenAuth: []
      summary: Terminates instance of a ec2 job, requires operator access, this will be…
      parameters:
      - $ref: '#/components/parameters/region'
      - $ref: '#/components/parameters/instance_id'
      responses:
        '201':
          description: Pubnub info
          content:
            application/json:
              schema:
                type: object
                required:
                - response
                properties:
                  response:
                    type: string
                    description: response
                example:
                  response: Terminated instance
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Internal Server Error
      tags:
      - Destroy
      operationId: getDestroyByRegionByInstanceId
      x-operation-id-source: derived
components:
  responses:
    UnauthorizedError:
      description: Token key is missing or invalid
      headers:
        WWW_Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
    badRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
  parameters:
    instance_id:
      name: id
      in: query
      description: Instance ID
      required: true
      schema:
        type: string
    region:
      name: id
      in: query
      description: Region
      required: true
      schema:
        type: string
  schemas:
    errorMessage:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - status
          - message
          - code
          properties:
            status:
              type: integer
              description: HTTP Status Code
            message:
              type: string
              description: Error description
            code:
              type: string
              description: Pre defined Error code
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: query
      name: token
