openapi: 3.2.0
info:
  description: 'The purpose of this application is to provide documentation of the APIs in mapsor


    # Authentication


    <!-- ReDoc-Inject: <security-definitions> -->'
  title: Mapsor Disable User API
  contact:
    email: arpitm@amagi.com
  version: 0.2.0
servers:
- url: https://pbohw6r8e1.execute-api.us-east-1.amazonaws.com/dev/?token=Vqv80iwJyHVPreFu47dNYg
  description: Development Server
- url: https://api.mapsor.amagi.tv
  description: Production Server
tags:
- name: Disable User
paths:
  /disable-user:
    post:
      security:
      - TokenAuth: []
      summary: disables user, requires admin's auth token
      operationId: disableUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              properties:
                user:
                  type: string
                  description: Username
              example:
                user: cloudport
      responses:
        '201':
          description: Successfully disabled user
          content:
            text/plain:
              schema:
                type: text
                example:
                  message: Successfully disabled user
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '409':
          $ref: '#/components/responses/conflictResourceError'
        '500':
          description: Internal Server Error
      tags:
      - Disable User
components:
  responses:
    UnauthorizedError:
      description: Token key is missing or invalid
      headers:
        WWW_Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
    forbiddenError:
      description: Forbidden to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
    conflictResourceError:
      description: Image Already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
    badRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorMessage'
  schemas:
    errorMessage:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - status
          - message
          - code
          properties:
            status:
              type: integer
              description: HTTP Status Code
            message:
              type: string
              description: Error description
            code:
              type: string
              description: Pre defined Error code
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: query
      name: token
